name: Build and Publish Packages

on:
  push:
    branches: [main, develop]
    paths:
      - 'genesi-arch/packages/**'
      # genesi-code is NOT built here (172 MB, release-hosted via publish-apps.yml).
      # Exclude it so bumping its PKGBUILD doesn't needlessly rebuild every package.
      - '!genesi-arch/packages/genesi-code/**'
      - '.github/workflows/publish-packages.yml'
      - '.gitmodules'
      # Submodule gitlinks. PKGBUILDs source from these via
      # `source=("git+https://github.com/Genesi-OS/genesi-*.git")` (cloning
      # HEAD of the submodule's upstream branch), so a bare submodule
      # pointer bump in this repo MUST rebuild the packages or `repo/x86_64`
      # ships stale content. Without these paths, every change like
      # `WindowCornerRadius=14`, `ButtonIconStyle=StyleFluent`,
      # `popupHeight=509`, Darkly 70% transparencies, etc. is committed
      # upstream and the parent pointer is bumped, but CI never fires and
      # the live ISO + installed systems keep installing the old .pkg.tar.zst
      # produced from the previous build. Reproduced 2026-05-27.
      - 'genesi-settings-full'
      - 'genesi-welcome-full'
      - 'genesi-calamares-config-full'
      - 'genesi-update-full'
      - 'genesi-packageinstaller-full'
      - 'cachyos-calamares-full'
      - 'cachyos-pkgbuilds'
  workflow_dispatch:

permissions:
  contents: write

# Serialize publish runs per branch. The packages are committed INTO the git
# tree (genesi-arch/repo/x86_64), so two concurrent runs both regenerate the
# binary genesi.db + *.pkg.tar.zst and the loser's rebase hits an unmergeable
# binary conflict ("rebase conflict while publishing packages"). Queue them so
# each run rebuilds cleanly on top of the previous one's published state.
concurrency:
  group: publish-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # cachyos-v3 ships with CachyOS repos preconfigured + keyring trusted,
      # which is required because several Genesi packages depend on CachyOS-only
      # packages (cachyos-ananicy-rules, zram-generator, ananicy-cpp, etc.).
      image: cachyos/cachyos-v3:latest
      # --privileged so we can swapon a swapfile: genesi-llama-cpp's Vulkan
      # shader-gen forks hundreds of compilers and exhausts the runner's RAM
      # ("Cannot allocate memory / Failed to fork process"); swap raises the
      # kernel commit limit so fork() succeeds. Same pattern as iso-pipeline.
      options: --privileged

    steps:
      - name: Install git in container
        # The image may not include git in PATH; without it, actions/checkout
        # falls back to the REST API which does not support `submodules`.
        # --needed skips reinstalling when git is already present (cachyos-v3
        # ships with git, and reinstalling it on top of a running process can
        # deadlock the pacman transaction).
        run: |
          set -euo pipefail
          # CachyOS rotates repo signing keys periodically and the cachyos-v3
          # base image can lag behind. Bootstrap fresh keyrings before the first
          # verified sync, otherwise CI can die before checkout with:
          #   error: cachyos-extra-v3: signature from "CachyOS" is invalid
          cp /etc/pacman.conf /etc/pacman.conf.bak
          sed -i 's/^[[:space:]]*SigLevel.*/SigLevel = Never/' /etc/pacman.conf
          pacman -Sy --noconfirm --needed archlinux-keyring cachyos-keyring || true
          mv /etc/pacman.conf.bak /etc/pacman.conf
          pacman-key --init || true
          pacman-key --populate archlinux cachyos || true

          if ! pacman -Sy --needed --noconfirm git openssh; then
            echo "::warning::verified sync still failing - retrying with SigLevel=Never for CI bootstrap tools"
            cp /etc/pacman.conf /etc/pacman.conf.bak
            sed -i 's/^[[:space:]]*SigLevel.*/SigLevel = Never/' /etc/pacman.conf
            pacman -Sy --needed --noconfirm git openssh
            mv /etc/pacman.conf.bak /etc/pacman.conf
          fi

      - name: Determine channel
        id: channel
        shell: bash
        run: |
          # `db` is the pacman REPOSITORY NAME, and it has to differ per channel.
          #
          # pacman fetches "<repo-name>.db" from a repo's Server URL, so the
          # block called [genesi-testing] in pacman.conf asks for
          # genesi-testing.db. This job published genesi.db unconditionally on
          # every branch, which meant the testing channel 404'd on the very
          # first `pacman -Syy` — nobody could ever have used it. Both channels
          # still publish to the same path; the branch in the URL is what keeps
          # them apart, and this name is what lets a machine subscribe to both
          # at once and let pacman pick the newer package.
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "name=stable"  >> "$GITHUB_OUTPUT"
            echo "branch=main"  >> "$GITHUB_OUTPUT"
            echo "db=genesi"    >> "$GITHUB_OUTPUT"
          else
            echo "name=testing" >> "$GITHUB_OUTPUT"
            echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "db=genesi-testing" >> "$GITHUB_OUTPUT"
          fi
          echo "Channel: $(cat "$GITHUB_OUTPUT" | grep '^name=' | cut -d= -f2)"

      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      # Before the 25-minute build, not after: a key that is configured but does
      # not match the keyring we ship is a hard error, and there is no reason to
      # spend half an hour discovering it.
      - name: Import the repository signing key
        id: signing
        uses: ./.github/actions/signing-key
        with:
          # A repository VARIABLE, not a secret, and separate from the key:
          # the key existing is not permission to use it.
          enabled:        ${{ vars.GENESI_SIGNING_ENABLED }}
          signing_key:    ${{ secrets.GENESI_SIGNING_KEY }}
          signing_key_id: ${{ secrets.GENESI_SIGNING_KEY_ID }}
          passphrase:     ${{ secrets.GENESI_SIGNING_KEY_PASSPHRASE }}

      - name: Install build deps
        # Avoid `pacman -Syu`: upgrading pacman itself mid-CI can deadlock or
        # break the running container. We only need DB refresh + missing deps.
        # Pre-install ALL runtime deps used by the Genesi PKGBUILDs so makepkg -s
        # has nothing to install and cannot deadlock on a pacman prompt.
        # --overwrite='*' avoids prompts when files conflict between cachyos-v3
        # base packages and what we are layering on top.
        run: |
          set -euxo pipefail
          pacman -Sy --noconfirm

          # Collect every depends/makedepends/checkdepends declared by the
          # Genesi PKGBUILDs so makepkg never needs `-s` (which would call
          # `sudo pacman` from the unprivileged builder and is fragile).
          # Strip version constraints — pacman -S takes plain names. Also drop
          # genesi-* deps: those are built by THIS pipeline and aren't in any
          # repo yet, so `pacman -S genesi-foo` would fail. (Only the
          # genesi-desktop meta-package has genesi-* deps; it's built with
          # `makepkg -d` so its dep check is skipped at build time.)
          #
          # A handful of Genesi packages repackage AUR-only software under its
          # canonical name via provides= (genesi-app2unit -> app2unit,
          # genesi-libcava -> libcava, genesi-materialyoucolor ->
          # python-materialyoucolor, genesi-ttf-rubik-vf -> ttf-rubik-vf,
          # genesi-caelestia-{cli,shell} -> caelestia-{cli,shell}). Their bare
          # names are NOT in any pacman repo at build-deps time (only this run
          # produces them), so they must be excluded here too or `pacman -S`
          # aborts the whole pre-install. The dependent packages skip makepkg's
          # dep check (-d, see MAKEPKG_NODEPS below), and nothing actually needs
          # these at build time — only at install time, where the genesi repo
          # resolves them via provides.
          #
          # `llama.cpp` is the same case: genesi-desktop depends on the VIRTUAL
          # `llama.cpp` provide (so EITHER genesi-llama-cpp or llama.cpp-cuda
          # satisfies it — letting users switch to the CUDA backend without
          # breaking the meta-package). That provide is produced by THIS run's
          # genesi-llama-cpp and isn't a real package name in any repo, so
          # `pacman -S llama.cpp` would fail with "target not found: llama.cpp".
          # genesi-desktop builds with `makepkg -d`, so it never needs it here.
          DEPS=$(
            for pkgbuild in genesi-arch/packages/*/PKGBUILD; do
              bash -c "
                set +u
                # shellcheck disable=SC1090
                source '$pkgbuild' 2>/dev/null || exit 0
                printf '%s\n' \"\${depends[@]}\" \"\${makedepends[@]}\" \"\${checkdepends[@]}\"
              "
            done \
              | sed -E 's/[<>=].*//' \
              | grep -vE '^(genesi-.*|app2unit|libcava|python-materialyoucolor|ttf-rubik-vf|caelestia-cli|caelestia-shell|llama\.cpp|cargo|cachyos-gaming-meta|cachyos-gaming-applications)$' \
              | sort -u \
              | grep -v '^$' \
              | tr '\n' ' '
          )
          echo "Collected deps: $DEPS"

          # base-devel and sudo are needed by makepkg itself; the rest comes
          # from the PKGBUILDs. python-requests/python-packaging are tooling
          # used by ISO/CI scripts outside the PKGBUILDs.
          #
          # systemd + systemd-sysvcompat MUST go together. The cachyos-v3
          # container snapshot ships these at e.g. 260.1, but `pacman -Sy`
          # above pulls fresh DBs where systemd may already be at 260.2.
          # If any transitive dep in $DEPS pulls systemd, pacman tries to
          # upgrade systemd alone -> breaks the strict
          # `systemd-sysvcompat requires systemd=260.1` dep -> transaction
          # aborts. Listing both explicitly forces pacman to resolve them
          # as a single upgrade group. Reproduced 2026-05-29 CI run on
          # commit 3c14822 (exit code 1 at this step).
          # Install with retries — the CachyOS CDN (cdn77) intermittently
          # returns HTTP 5xx (e.g. 572) and aborts the whole transaction with
          # "failed to retrieve some files". That is pure infra flake, unrelated
          # to the PKGBUILDs, so retry a few times (refreshing DBs each attempt
          # in case a mirror caught up) before giving up. Reproduced 2026-06-03.
          # -Syy (double y) FORCES a fresh DB download EVERY attempt. A plain
          # -Sy may skip the refresh when it thinks the DB is current, leaving us
          # pinned to a version a mirror already rotated away → 404. Seen
          # 2026-06-09: qt5-base-...r96 vanished from cdn77 (404) while
          # us.cachyos.org was 523 (origin down), and the single -Sy kept
          # re-requesting the gone r96. Forcing the DB re-download lets pacman
          # pick up the current version once any mirror is consistent again.
          install_deps() {
            pacman -Syy --noconfirm && \
            pacman -S --needed --noconfirm --overwrite='*' \
              base-devel git sudo rust \
              systemd systemd-sysvcompat \
              python-requests python-packaging \
              $DEPS
          }
          for attempt in 1 2 3 4 5 6 7; do
            if install_deps; then
              echo "build deps installed (attempt $attempt)"
              break
            fi
            if [ "$attempt" = 7 ]; then
              echo "::error::build deps failed after 7 attempts (CachyOS mirror/CDN inconsistent)"
              exit 1
            fi
            echo "::warning::build-deps attempt $attempt failed (CachyOS CDN 404/5xx); refreshing DBs, retry in 30s"
            sleep 30
          done

          # Reclaim disk NOW, before any package builds. The container's / is a
          # thin overlay on the host runner's small root partition, and after
          # pulling Qt6/vulkan/rust/base-devel + every PKGBUILD dep, the
          # downloaded package tarballs in /var/cache/pacman/pkg pile up to
          # several GB that are never needed again (makepkg -s is a no-op here —
          # all deps are already installed). Leaving them behind is what left
          # only ~956MB free before the build even started, so the heavy
          # genesi-caelestia-shell Qt build died writing its PCH files with
          # "No space left on device" (CI run #331, commit 2c836e0). Clearing the
          # cache here is pure headroom with zero effect on the produced repo.
          echo "Disk before cache purge:"; df -h / || true
          pacman -Scc --noconfirm || rm -rf /var/cache/pacman/pkg/* || true
          echo "Disk after cache purge:"; df -h / || true

      - name: Normalize build flags for broad CPU compatibility
        shell: bash
        run: |
          set -euxo pipefail
          # The cachyos-v3 container's makepkg.conf compiles C/C++ with
          # -march=native (= the GitHub runner's CPU, frequently AVX-512), and
          # its rust.conf uses target-cpu=native. Both bake instructions that
          # older/consumer bare-metal CPUs and VMs may lack.
          #
          # 2026-07-09: reproduced again — cachyos-pi (genesi-packageinstaller)
          # SIGILL'd on an AVX2-only VirtualBox VM. Disassembly at the faulting
          # PC showed EVEX AVX-512 (vpbroadcastq %rax,%ymm / vpgatherdq {%k1}).
          # Root cause: the old sed below only rewrote `-march=x86-64-vN` and
          # NEVER matched `-march=native`, so every C/C++ package kept whatever
          # ISA the build runner happened to have -> non-deterministic
          # "works on one CI run, SIGILLs on the next". The `-march=[^ "]+`
          # catch-all now pins ANY march value (native, v3, v4, …) to baseline.
          #
          # The [genesi] repo (pacman.conf) ships a SINGLE build to EVERY
          # machine — unlike the [cachyos] repo which has per-arch v1/v3/v4
          # variants that pacman's `Architecture = auto` picks per CPU. So the
          # base system installs v1 packages on a non-v3 CPU (and boots fine),
          # but cachyos-pi & friends came only in v3 and die with
          # "Illegal instruction (core dumped)" on real hardware while running
          # fine in a v3-capable dev VM. Reproduced 2026-06-07 (cachyos-pi).
          #
          # Until the genesi repo ships per-arch variants, pin this single build
          # to the baseline x86-64 ISA so it runs on any x86-64 CPU.
          for f in /etc/makepkg.conf /etc/makepkg.conf.d/*.conf; do
            [ -f "$f" ] || continue
            sed -i -E \
              -e 's/-march=[^ "]+/-march=x86-64/g' \
              -e 's/-mtune=[^ "]+/-mtune=generic/g' \
              -e 's/(-C[[:space:]]*target-cpu=)[^ "]+/\1x86-64/g' \
              "$f"
          done
          echo "Effective arch flags after normalization:"
          grep -RHE 'march=|mtune=|target-cpu=' /etc/makepkg.conf /etc/makepkg.conf.d/ || true

      - name: Headroom for the heavy Vulkan build (overcommit + swap)
        shell: bash
        run: |
          # genesi-llama-cpp's Vulkan shader-gen forks hundreds of compilers, and
          # the runner refuses the fork()s with ENOMEM ("Cannot allocate memory")
          # because the kernel's commit heuristic denies the COW reservation.
          set -x
          # 1) DIRECT FIX: tell the kernel to always allow the memory reservation
          #    so fork() stops being denied (privileged container -> host /proc).
          sysctl -w vm.overcommit_memory=1 || echo "::warning::could not set overcommit"
          # 2) Real swap as a backstop so the OOM killer doesn't actually fire.
          #    BEST-EFFORT only — overcommit=1 above is the real fix; never fail
          #    the build over swap. 2026-06-21: a FIXED 16G swapfile hit "No space
          #    left on device" on a low-disk runner (fallocate unsupported on the
          #    overlay fs -> dd wrote real bytes -> ENOSPC -> set -e killed the
          #    build). Keep the swap deliberately small: reserving half of the
          #    runner disk starved later source builds (Calamares/Klassy) and
          #    crashed the Actions worker itself with ENOSPC. Overcommit above
          #    is the primary fix; swap is only a modest backstop.
          set +e
          if [ ! -e /ci-swapfile ]; then
            avail_mb=$(df --output=avail -m / 2>/dev/null | tail -1 | tr -d ' '); avail_mb=${avail_mb:-0}
            want_mb=$(( avail_mb / 4 )); [ "$want_mb" -gt 4096 ] && want_mb=4096
            if [ "$want_mb" -ge 2048 ]; then
              fallocate -l "${want_mb}M" /ci-swapfile 2>/dev/null \
                || dd if=/dev/zero of=/ci-swapfile bs=1M count="$want_mb" status=none
              if [ -s /ci-swapfile ]; then
                chmod 600 /ci-swapfile
                mkswap /ci-swapfile >/dev/null 2>&1 && swapon /ci-swapfile \
                  || echo "::warning::swapon failed — relying on overcommit"
              fi
              # reclaim a half-written / unused file so it can't starve the build
              swapon --show 2>/dev/null | grep -q /ci-swapfile || rm -f /ci-swapfile
            else
              echo "::warning::low disk (${avail_mb}MB free) — no swapfile, relying on overcommit"
            fi
          fi
          set -e
          swapon --show || true
          free -h || true

      - name: Build packages
        shell: bash
        env:
          DB:           ${{ steps.channel.outputs.db }}
          SIGN_ENABLED: ${{ steps.signing.outputs.enabled }}
          SIGN_KEYID:   ${{ steps.signing.outputs.keyid }}
        run: |
          set -euo pipefail
          useradd -m -G wheel builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

          cd "$GITHUB_WORKSPACE/genesi-arch/packages"
          mkdir -p repo
          chown builder:builder repo

          # Every run rebuilds the complete repository. Keeping the checked-in
          # binary registry duplicates all packages while the fresh artifacts
          # accumulate in packages/repo, wasting several GB on the runner.
          rm -rf "$GITHUB_WORKSPACE/genesi-arch/repo/x86_64"

          # Keep downloaded sources outside package directories so each
          # package's source cache can be reclaimed immediately after build.
          mkdir -p "$GITHUB_WORKSPACE/.ci-sources"
          chown builder:builder "$GITHUB_WORKSPACE/.ci-sources"

          PACKAGES=(
            # The trust anchor. First because it is a pure-data leaf with no
            # build deps, and because everything after it is only meaningful if
            # machines can eventually verify it. Skipped automatically while no
            # key exists — see the guard in the loop below.
            "genesi-keyring"
            "genesi-settings"
            "genesi-kde-settings"
            "genesi-ai-mode"
            "genesi-mempalace"
            "genesi-update"
            "genesi-channel"
            # The return path: collect diagnostics, redact them, open a
            # pre-filled issue. Pure bash, so it costs nothing to build and it
            # still runs on the boot where the desktop did not come up.
            "genesi-report"
            "genesi-calamares"
            "genesi-calamares-branding"
            "genesi-welcome"
            # Window decoration + widget style + glassmorphism. Built from
            # source (paulmcauley/klassy, Bali10050/Darkly). These replace the
            # fragile customize_airootfs.sh "build on live, cp to target" hack
            # so the INSTALLED system actually has the plugins (2026-06-01:
            # reproduced installs with kwinrc->klassy but no plugin on disk).
            "genesi-klassy"
            "genesi-darkly"
            # Branded GRUB background (no more black "Arch Linux" menu).
            "genesi-grub-theme"
            # Branded boot splash. Must be built before genesi-desktop, which
            # depends on it, or the published meta-package becomes impossible
            # to install and validate-install fails with "target not found".
            "genesi-plymouth"
            # Branded fastfetch greeting (logo + system info) in the terminal.
            "genesi-fastfetch"
            # "Coat of paint" for the CachyOS-imported GTK desktops
            # (GNOME/Xfce/Cinnamon/MATE): a login-time autostart script that
            # applies the Genesi wallpaper, dark theme, accent and launchers.
            # No-ops on KDE/Hyprland (they have their own branding).
            "genesi-de-branding"
            # NOTE: genesi-openbox-settings was REMOVED here (2026-07-09). Openbox
            # is no longer a selectable DE in the Calamares chooser, nothing
            # depends on the package (not genesi-desktop, no netinstall group), so
            # it was built + committed to the git repo but installed by nobody.
            # Worse, the upstream cachyos-openbox-settings tarball bundles two
            # FULL icon themes (Papirus-Custom + Papirus-Dark-Custom = ~125k
            # files), and makepkg processing all of them under fakeroot on the
            # runner's overlayfs blew past the 25-min per-package timeout and
            # hung the whole publish. Re-add (and prune the bundled icon themes)
            # only if Openbox comes back as a real DE option.
            # Genesi fork of the CachyOS package installer (Qt6 + Rust). Verified
            # to build in ~112s via test-packageinstaller.yml — well under the
            # 25-min per-package budget, so it won't stall the publish pipeline.
            "genesi-packageinstaller"
            # Phase 4.3-4.6 developer tools. Self-contained (scripts + QML +
            # PySide6 apps, no genesi-* build deps), so they slot in anywhere
            # before the meta-package.
            "genesi-containers"
            "genesi-ports"
            "genesi-forge"
            # genesi-sandboxes (Workspaces) is NO LONGER BUILT (2026-08-15). Its
            # UI was broken and Genesi Forge covers the project-workspace need.
            # The source stays in genesi-arch/packages/ so it can be revived by
            # putting this line back; nothing else references it.
            "genesi-netinspect"
            "genesi-db-explorer"
            # "Indestructible OS" — effortless Btrfs snapshots (snapper + snap-pac
            # + grub-btrfs) + a branded manager app. Self-contained (its deps are
            # all real repo packages), so it slots in with the other dev tools.
            "genesi-snapshots"
            # Studio Mode — focus one app, freeze the rest, restore after.
            # Self-contained (Python + QML + a GNOME extension, no compiled
            # parts), and its check() runs the freeze-safety tests at build
            # time, so a regression in "what may be frozen" fails the publish
            # instead of shipping a desktop that can lock up.
            "genesi-studio"
            # Optional gaming meta/autoconfig. Built with -d so CI does not
            # install the entire Steam/Lutris/Proton stack into the builder.
            "genesi-gaming"
            # Roadmap 5.1 — "Hyprland + caelestia-shell" desktop option. These
            # repackage AUR-only software (quickshell itself is now in Arch
            # [extra], so it is NOT rebuilt here) so the Calamares netinstall can
            # install them with pacman. Ordered leaves-first: the four small
            # AUR libs/fonts (only [extra] build-deps, normal build) before the
            # caelestia packages that depend on them. caelestia-cli/shell/settings
            # depend on the just-built (not-yet-installed) genesi provides, so
            # they build with `makepkg -d` (see MAKEPKG_NODEPS below).
            "genesi-app2unit"
            "genesi-libcava"
            "genesi-materialyoucolor"
            "genesi-ttf-rubik-vf"
            "genesi-caelestia-cli"
            "genesi-caelestia-shell"
            "genesi-caelestia-settings"
            # Genesi Mesh — pools GPU memory across machines on the LAN. Pure
            # Python + a systemd unit, so it is cheap to build; it needs a
            # GGML_RPC=ON llama.cpp at RUNTIME (optdepends), not at build time.
            "genesi-mesh"
            # NOTE: genesi-code is NOT built here. Its package is 172 MB, which
            # exceeds GitHub's 100 MB git file limit, so it can't be committed to
            # the git-hosted repo. It is built and published to the separate
            # release-hosted [genesi-apps] repo by publish-apps.yml instead.
            # llama.cpp (Vulkan) — backs Genesi Turbo's `llama-server`. Verified
            # green via test-llama-cpp.yml (~10min, well under the 25-min budget).
            # Kept LAST so if its build ever flakes it can't block the others.
            "genesi-llama-cpp"
            # Meta-package (depends on all the above). Built with `makepkg -d`
            # (see MAKEPKG_NODEPS) since its genesi-* deps aren't in a repo yet.
            # Last so every component it lists has already been built this run.
            "genesi-desktop"
          )

          for pkg in "${PACKAGES[@]}"; do
            echo "::group::Building $pkg"
            if [ ! -d "$pkg" ]; then
              echo "::warning::Package directory not found: $pkg — skipping"
              echo "::endgroup::"
              continue
            fi
            # genesi-keyring's payload IS the key, and the key is generated once
            # by hand (devtools/genesi-keygen.sh), not by CI. Until that has
            # happened the package has nothing to install, so skip it instead of
            # failing the run — a distribution that cannot publish updates is a
            # worse outcome than one that is not yet signed. The matching
            # "key configured but keyring empty" case is a hard error, caught
            # much earlier by the verify step.
            if [ "$pkg" = "genesi-keyring" ] && [ ! -f "$pkg/genesi.gpg" ]; then
              echo "::warning::genesi-keyring has no public key yet — skipping (run devtools/genesi-keygen.sh)"
              echo "::endgroup::"
              continue
            fi
            # 25-min ceiling per package so a hang fails loudly instead of
            # eating the whole 6h GitHub job timeout in silence.
            # PACMAN env adds --overwrite='*' so missing-dep installs by makepkg
            # never block on file conflicts.
            # Diagnostic: prove builder can reach makepkg before invoking it.
            # `runuser` (util-linux) is used instead of `sudo` because PAM is
            # often broken in minimal Arch containers, which surfaces as the
            # builder process being killed by SIGUSR1 (exit 138).
            echo "--- diag for $pkg ---"
            id builder || true
            ls -la "$pkg" | head -10
            runuser -u builder -- bash -c "id; which makepkg; makepkg --version | head -1" || true
            # If sudo from inside builder is broken (PAM in minimal container),
            # makepkg -s will be killed by SIGUSR1 the moment it tries to call
            # `sudo pacman` for deps. Probe it explicitly.
            if runuser -u builder -- sudo -n true 2>&1; then
              echo "diag: sudo works for builder"
            else
              echo "diag: sudo BROKEN for builder (rc=$?) — relying on pre-installed deps"
            fi
            echo "--- /diag ---"

            # The genesi-desktop meta depends on other Genesi packages that
            # aren't in any repo at build time; skip makepkg's dep check for it
            # (-d). Install-time resolution from the genesi repo still applies.
            # Skip makepkg's dep check (-d) for packages whose declared deps are
            # produced by THIS run and aren't in any repo yet: the genesi-desktop
            # meta, and the caelestia packages (which depend on the genesi
            # repackages of caelestia-cli/app2unit/libcava/python-materialyoucolor
            # /ttf-rubik-vf). Nothing here is actually needed at build time;
            # install-time resolution from the genesi repo still applies.
            MAKEPKG_NODEPS=""
            case "$pkg" in
              genesi-desktop|genesi-gaming|genesi-plymouth|genesi-snapshots|genesi-caelestia-cli|genesi-caelestia-shell|genesi-caelestia-settings)
                MAKEPKG_NODEPS="-d" ;;
            esac

            rc=0
            for attempt in 1 2; do
              # Do NOT set PACMAN='pacman --overwrite=*'. makepkg does
              # `PACMAN_PATH=$(type -P $PACMAN)` unquoted, so a value with
              # spaces makes type -P fail (the flag isn't an executable),
              # which triggers makepkg's ERR trap → SIGUSR1 → exit 138.
              # We don't need --overwrite anyway: -s is gone and deps are
              # pre-installed in the previous step.
              if timeout 1500 bash -c "cd '$pkg' && rm -f *.pkg.tar.zst && \
                runuser -u builder -- env \
                  PKGDEST='$GITHUB_WORKSPACE/genesi-arch/packages/repo' \
                  SRCDEST='$GITHUB_WORKSPACE/.ci-sources/$pkg' \
                  makepkg -f $MAKEPKG_NODEPS --noconfirm --noprogressbar --log"; then
                rc=0
                break
              else
                rc=$?
              fi
              # 138 = 128+SIGUSR1, 137 = 128+SIGKILL — retry once for transient
              if [ "$rc" -eq 138 ] || [ "$rc" -eq 137 ]; then
                echo "::warning::Package $pkg killed by signal (exit $rc) on attempt $attempt — retrying"
                continue
              fi
              break
            done

            if [ "$rc" -ne 0 ]; then
              # Successful makepkg logs can be enormous (Klassy alone emits
              # thousands of install lines), inflating the runner's diagnostic
              # log. Only print them when they are needed to explain a failure.
              for log in "$pkg"/*.log; do
                [ -f "$log" ] || continue
                echo "::group::makepkg log: $log"
                cat "$log"
                echo "::endgroup::"
              done
              if [ "$rc" -eq 124 ]; then
                echo "::error::Package $pkg timed out after 25 minutes"
              else
                echo "::error::Package $pkg failed with exit $rc"
              fi
              # Show which declared deps pacman thinks are missing — answers
              # "is the build dying because a dep wasn't installed?".
              if [ -f "$pkg/PKGBUILD" ]; then
                echo "::group::dep status for $pkg"
                ( cd "$pkg" && \
                  ALL_DEPS=$(bash -c 'source ./PKGBUILD; printf "%s\n" "${depends[@]}" "${makedepends[@]}"' | sort -u | tr -d "'\"") && \
                  echo "declared: $ALL_DEPS" && \
                  echo "missing:" && \
                  pacman -T $ALL_DEPS || true )
                echo "::endgroup::"
              fi
              exit 1
            fi

            # Install just-built LEAF packages that LATER packages need at BUILD
            # time. caelestia-shell's plugin/CMakeLists.txt runs
            # pkg_check_modules(cava), which needs libcava's cava.pc on disk at
            # configure time. genesi-libcava is built earlier in THIS run but
            # isn't in any repo, and caelestia-shell builds with -d, so without
            # this the configure step dies "Package 'cava' not found" (the cause
            # of CI run #177 failing). These four repackage AUR libs/fonts under
            # provides= and conflict with nothing pre-installed, so installing
            # them into the build container is safe. The loop body runs as root
            # (only makepkg drops to `builder`), so pacman -U works here.
            case "$pkg" in
              genesi-app2unit|genesi-libcava|genesi-materialyoucolor|genesi-ttf-rubik-vf)
                builtpkg=$(ls -1t "repo/$pkg"-*.pkg.tar.zst 2>/dev/null | grep -v -- '-debug-' | head -1)
                if [ -n "$builtpkg" ]; then
                  echo "Installing $builtpkg into the build container (build-time dep for caelestia)"
                  pacman -U --noconfirm --overwrite='*' "$builtpkg" \
                    || echo "::warning::could not install $builtpkg into container"
                fi ;;
            esac

            # The final package is already safe in packages/repo. Source trees,
            # fakeroot package trees, downloaded archives and success logs are
            # disposable and otherwise accumulate until the runner disk fills.
            rm -rf "$pkg/src" "$pkg/pkg" "$GITHUB_WORKSPACE/.ci-sources/$pkg"
            rm -f "$pkg"/*.log
            echo "::endgroup::"
          done

          rm -rf "$GITHUB_WORKSPACE/.ci-sources"

          # A meta-package built with makepkg -d can be created even when one
          # of its Genesi dependencies was accidentally omitted from PACKAGES.
          # Refuse to publish that broken repository snapshot. This catches the
          # exact genesi-desktop -> genesi-plymouth regression before the ISO
          # workflow has to discover it later.
          while IFS= read -r dep; do
            dep="${dep%%[<>=]*}"
            case "$dep" in
              genesi-*)
                if ! compgen -G "repo/${dep}-*.pkg.tar.zst" >/dev/null; then
                  echo "::error::genesi-desktop dependency was not built: ${dep}"
                  exit 1
                fi ;;
            esac
          done < <(bash -c 'source genesi-desktop/PKGBUILD; printf "%s\n" "${depends[@]}"')
          echo "All genesi-desktop package dependencies are present."

          cd repo
          # Fail loudly rather than build a repo called ".db": an empty DB here
          # would silently publish an unusable database over the STABLE channel.
          : "${DB:?the channel step did not provide a repo db name}"
          # Clear BOTH names, not just ours: a branch that used to publish the
          # wrong one must not leave it behind for pacman to find. The db/files
          # patterns already sweep up their own .sig files; the package
          # signatures need their own line, or a .sig from a previous run could
          # outlive the package it covers.
          rm -f genesi.db* genesi.files* genesi-testing.db* genesi-testing.files*
          rm -f ./*.pkg.tar.zst.sig

          # ── Sign every package, THEN index ──────────────────────────────────
          #
          # Order is load-bearing: repo-add records a package's signature in the
          # database only if the .sig is already on disk beside it. Signing after
          # repo-add produces signatures pacman never learns about, and a repo
          # that looks signed on the mirror but unsigned to the client.
          REPO_ADD_SIGN=()
          if [ "${SIGN_ENABLED:-0}" = "1" ]; then
            GPG_ARGS=(--batch --yes --no-tty --detach-sign --local-user "${SIGN_KEYID}")
            # ${GNUPGHOME:-} so `set -u` cannot bite if the env ever arrives
            # without it; the no-passphrase case is the normal one.
            if [ -f "${GNUPGHOME:-}/passphrase" ]; then
              GPG_ARGS+=(--pinentry-mode loopback --passphrase-file "${GNUPGHOME}/passphrase")
            fi

            echo "::group::Signing $(ls -1 ./*.pkg.tar.zst | wc -l) package(s) with ${SIGN_KEYID}"
            for p in ./*.pkg.tar.zst; do
              gpg "${GPG_ARGS[@]}" --output "${p}.sig" "${p}"
            done
            echo "::endgroup::"

            # Verify what we just produced. A signature that does not verify is
            # a package that will be REJECTED on every machine the moment
            # SigLevel becomes Required, and there is no reason to discover that
            # anywhere but here.
            for p in ./*.pkg.tar.zst; do
              gpg --batch --quiet --verify "${p}.sig" "${p}" 2>/dev/null \
                || { echo "::error::signature does not verify: ${p}"; exit 1; }
            done
            echo "All package signatures verified."

            REPO_ADD_SIGN=(--sign --key "${SIGN_KEYID}")
            export GPGKEY="${SIGN_KEYID}"
          else
            echo "::warning::no signing key — the published repository will be UNSIGNED"
          fi

          # `${a[@]+"${a[@]}"}` rather than `"${a[@]}"`: under `set -u` an empty
          # array is an unbound variable on older bash, and the unsigned path is
          # exactly the one that must never break.
          repo-add ${REPO_ADD_SIGN[@]+"${REPO_ADD_SIGN[@]}"} "${DB}.db.tar.gz" ./*.pkg.tar.zst

          # The database signature is what stops an attacker swapping the whole
          # index (and with it every package's recorded checksum), so its
          # absence is a silent downgrade rather than a cosmetic gap.
          if [ "${SIGN_ENABLED:-0}" = "1" ] && [ ! -f "${DB}.db.tar.gz.sig" ]; then
            echo "::error::repo-add did not produce ${DB}.db.tar.gz.sig"
            exit 1
          fi
          ls -lh

          # ── The question the pipeline never asked ────────────────────────
          #
          # Everything above verifies the repository from the point of view of
          # someone HOLDING the key. On 2026-08-29 that was all green while the
          # publish broke `pacman -Sy` on every installed machine, because the
          # opposite question went unasked: can a machine WITHOUT the key still
          # use this? Asked here, against the freshly built repo, before a
          # single byte is committed.
          cd "$GITHUB_WORKSPACE"
          # `rc=0; cmd || rc=$?`, NOT `if ! cmd; then rc=$?`. Inside the branch
          # of an `if !`, $? is the status of the negation (always 0), so the
          # untestable case (2) would have been read as 0 and fallen through to
          # the error — a missing pacman would have BLOCKED the publish. That is
          # the one thing this pipeline must never do.
          #
          # Which machine to impersonate follows the signing switch. Unsigned:
          # one with no key, because a stray signature would lock it out.
          # Signed: one that HAS genesi-keyring -- because once signing is
          # deliberately on, a keyring-less machine is MEANT to be rejected, and
          # keeping the old assumption would make this gate block every publish
          # forever.
          CONSUMABLE_ARGS=()
          if [ "${SIGN_ENABLED:-0}" = "1" ]; then
            CONSUMABLE_ARGS=(--with-key)
          fi
          rc=0
          bash genesi-arch/ci/repo-consumable-test.sh             "$GITHUB_WORKSPACE/genesi-arch/packages/repo" --db "${DB}"             ${CONSUMABLE_ARGS[@]+"${CONSUMABLE_ARGS[@]}"} || rc=$?
          case "${rc}" in
            0) ;;
            2) echo "::warning::could not verify the repo is consumable — publishing anyway" ;;
            *) echo "::error::refusing to publish a repository machines in the field cannot use"
               exit 1 ;;
          esac

      - name: Commit packages to in-repo registry
        shell: bash
        env:
          CHANNEL: ${{ steps.channel.outputs.name }}
          BRANCH:  ${{ steps.channel.outputs.branch }}
          DB:      ${{ steps.channel.outputs.db }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          # The "Build packages" step did `chown -R builder:builder` over the
          # whole workspace, including .git. That triggers git's CVE-2022-24765
          # dubious-ownership protection and surfaces as "fatal: not in a git
          # directory" when this step (running as root) tries to use the repo.
          # Restore ownership and whitelist the path.
          chown -R "$(id -u)":"$(id -g)" "$GITHUB_WORKSPACE/.git"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          # Place built artifacts where pacman.conf expects them.
          #
          # Both channels publish to genesi-arch/repo/x86_64 — what separates
          # them is the BRANCH in the raw.githubusercontent URL (main = stable,
          # develop = testing) and the DB NAME (genesi vs genesi-testing). Both
          # halves are required: the branch decides which packages a client
          # sees, and the name is what a client can actually ask for, since
          # pacman fetches "<repo-name>.db". A machine on the testing channel
          # subscribes to BOTH repos and pacman installs whichever is newer.
          : "${DB:?the channel step did not provide a repo db name}"
          mkdir -p genesi-arch/repo/x86_64
          # *.pkg.tar.zst.sig is matched by the first pattern's own glob only if
          # it is spelled out, and a signature left behind from a previous run
          # would claim to cover a package that is no longer there.
          rm -f genesi-arch/repo/x86_64/*.pkg.tar.zst \
                genesi-arch/repo/x86_64/*.pkg.tar.zst.sig \
                genesi-arch/repo/x86_64/genesi.* \
                genesi-arch/repo/x86_64/genesi-testing.*
          cp genesi-arch/packages/repo/*.pkg.tar.zst genesi-arch/repo/x86_64/ || true
          cp genesi-arch/packages/repo/*.pkg.tar.zst.sig genesi-arch/repo/x86_64/ 2>/dev/null || true
          cp "genesi-arch/packages/repo/${DB}.db.tar.gz" genesi-arch/repo/x86_64/ || true
          cp "genesi-arch/packages/repo/${DB}.files.tar.gz" genesi-arch/repo/x86_64/ || true
          cp "genesi-arch/packages/repo/${DB}.db.tar.gz.sig" genesi-arch/repo/x86_64/ 2>/dev/null || true
          cp "genesi-arch/packages/repo/${DB}.files.tar.gz.sig" genesi-arch/repo/x86_64/ 2>/dev/null || true
          # Pacman expects unsuffixed pointers as well. Use copies (not
          # symlinks) — raw.githubusercontent.com serves git symlinks as
          # plaintext (the link target path), which would break pacman when
          # a client points at the GitHub-raw URL.
          #
          # The signatures need the same treatment: pacman fetches
          # "<repo>.db.sig", not "<repo>.db.tar.gz.sig". Publishing the database
          # without moving its signature across would make every client see a
          # signed-then-unsigned repo and silently fall back to trusting it.
          ( cd genesi-arch/repo/x86_64 && \
            cp -f "${DB}.db.tar.gz"    "${DB}.db" && \
            cp -f "${DB}.files.tar.gz" "${DB}.files" && \
            { [ -f "${DB}.db.tar.gz.sig" ]    && cp -f "${DB}.db.tar.gz.sig"    "${DB}.db.sig"    || true; } && \
            { [ -f "${DB}.files.tar.gz.sig" ] && cp -f "${DB}.files.tar.gz.sig" "${DB}.files.sig" || true; } )

          git config user.email "actions@github.com"
          git config user.name  "Genesi Bot"
          # genesi-arch/repo/ is .gitignore'd so devs don't accidentally
          # commit local build outputs; only CI publishes it. -f bypasses.
          git add -f genesi-arch/repo
          if git diff --cached --quiet; then
            echo "No package changes to publish"
            exit 0
          fi
          git commit -m "ci(${CHANNEL}): publish packages from ${GITHUB_SHA:0:7}"

          # The package build takes ~25 min, during which `main` can move (a docs
          # commit, another push, the next publish run). A plain push then dies
          # with "Updates were rejected (fetch first)" and the whole publish is
          # LOST — the rebuilt .pkg.tar.zst never reaches the repo (reproduced
          # 2026-06-05). Our commit only touches genesi-arch/repo/, so it never
          # conflicts with source/doc commits: rebase onto the latest remote and
          # retry a few times so a concurrent push can't drop a publish.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${BRANCH}"; then
              echo "Published packages (push attempt ${attempt})"
              break
            fi
            if [ "${attempt}" = "5" ]; then
              echo "::error::could not push packages after 5 attempts"
              exit 1
            fi
            echo "push rejected (attempt ${attempt}/5) — re-basing publish onto origin/${BRANCH}…"
            git fetch origin "${BRANCH}"
            # Our commit ONLY (re)generates genesi-arch/repo/, and because every
            # run rebuilds the FULL package set + db, our freshly built artifacts
            # are the authoritative latest snapshot (a newer run's tree is a
            # superset of an older one's). A plain `git rebase` can't 3-way-merge
            # the BINARY repo db (genesi.db.tar.gz / *.pkg.tar.zst), so a
            # concurrent publish made it abort with a conflict and the whole
            # publish was LOST (run #158, 2026-06-16: the previous run's
            # "ci(stable): publish…" landed on main mid-build). Instead of
            # rebasing binary files, re-create our commit on top of the latest
            # remote tip: reset HEAD+index to origin (keeping our just-built
            # repo/ in the working tree), then re-stage and re-commit ONLY
            # genesi-arch/repo/. This preserves any concurrent source/doc change
            # on the branch and takes the repo artifacts from us (ours wins).
            git reset --mixed "origin/${BRANCH}"
            git add -f genesi-arch/repo
            if git diff --cached --quiet; then
              echo "No package changes to publish after sync"; exit 0
            fi
            git commit -m "ci(${CHANNEL}): publish packages from ${GITHUB_SHA:0:7}"
            sleep $(( (RANDOM % 4) + 2 ))
          done

      - name: Summary
        run: |
          echo "Channel: ${{ steps.channel.outputs.name }}"
          echo "Branch:  ${{ steps.channel.outputs.branch }}"
          echo "Packages published to genesi-arch/repo/x86_64 on branch ${{ steps.channel.outputs.branch }}"
          if [ "${{ steps.signing.outputs.enabled }}" = "1" ]; then
            echo "Signed:  yes (key ${{ steps.signing.outputs.keyid }})"
          else
            echo "Signed:  NO — set GENESI_SIGNING_KEY (genesi-arch/devtools/genesi-keygen.sh)"
          fi
