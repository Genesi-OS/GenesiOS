name: Test genesi-llama-cpp-cuda build

# Standalone, manual-only smoke build for the CUDA llama.cpp package, so we can
# confirm it compiles inside the cachyos-v3 CI (and TIME it) WITHOUT risking the
# load-bearing publish-packages.yml pipeline. CUDA cross-compiles for the target
# GPU arches with no GPU present, so this validates the build on a plain runner;
# runtime speed is validated separately on real NVIDIA hardware.
#
# Once this passes within budget, add "genesi-llama-cpp-cuda" to
# publish-packages.yml's PACKAGES array (kept LAST like genesi-llama-cpp so a
# flake can't block the others) and it lands in the [genesi] repo — at which
# point the Monitor's "install CUDA backend" button and the login notifier serve
# it as a fast `pacman -S` instead of the 40-min AUR source build.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: cachyos/cachyos-v3:latest
      # --privileged so we can swapon a swapfile: the CUDA kernel compile (one
      # set per target arch) forks heavy jobs and can exhaust the runner's RAM.
      options: --privileged
    steps:
      - name: Install git in container
        run: pacman -Sy --needed --noconfirm git openssh

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build deps (incl. CUDA toolkit)
        run: |
          set -euxo pipefail
          pacman -Sy --noconfirm
          # systemd + sysvcompat together to avoid the partial-upgrade break.
          # cuda pulls nvcc + headers + libcublas (~a few GB) — that's the whole
          # point of this test: prove the heavy toolkit build fits the runner.
          pacman -S --needed --noconfirm --overwrite='*' \
            base-devel git \
            systemd systemd-sysvcompat \
            cmake cuda

      - name: Headroom (overcommit + swap)
        shell: bash
        run: |
          set -x
          sysctl -w vm.overcommit_memory=1 || echo "::warning::could not set overcommit"
          set +e
          if [ ! -e /ci-swapfile ]; then
            avail_mb=$(df --output=avail -m / 2>/dev/null | tail -1 | tr -d ' '); avail_mb=${avail_mb:-0}
            want_mb=$(( avail_mb / 2 )); [ "$want_mb" -gt 16384 ] && want_mb=16384
            if [ "$want_mb" -ge 2048 ]; then
              fallocate -l "${want_mb}M" /ci-swapfile 2>/dev/null \
                || dd if=/dev/zero of=/ci-swapfile bs=1M count="$want_mb" status=none
              if [ -s /ci-swapfile ]; then
                chmod 600 /ci-swapfile
                mkswap /ci-swapfile >/dev/null 2>&1 && swapon /ci-swapfile \
                  || echo "::warning::swapon failed — relying on overcommit"
              fi
              swapon --show 2>/dev/null | grep -q /ci-swapfile || rm -f /ci-swapfile
            fi
          fi
          set -e
          swapon --show || true
          free -h || true

      - name: Build the package (timed)
        shell: bash
        run: |
          set -euo pipefail
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

          cd "$GITHUB_WORKSPACE/genesi-arch/packages/genesi-llama-cpp-cuda"
          start=$(date +%s)
          # 2h ceiling: CUDA compiles one kernel set per pinned arch and ggml-cuda
          # has hundreds of template instances, so it's far heavier than the
          # Vulkan build (the first attempt reached 44% in 50 min at -j2). The
          # PKGBUILD now parallelizes by CPU and trims arches; this generous
          # ceiling just lets a full run FINISH so we learn the real wall time.
          if timeout 7200 runuser -u builder -- \
              env PATH="/opt/cuda/bin:$PATH" makepkg -f --noconfirm --noprogressbar; then
            rc=0
          else
            rc=$?
          fi
          echo "build took $(( $(date +%s) - start ))s, exit=$rc"
          if [ "$rc" -ne 0 ]; then
            echo "::error::genesi-llama-cpp-cuda failed to build (exit $rc)"
            exit "$rc"
          fi
          echo "Built artifacts:"
          ls -lh ./*.pkg.tar.zst
          # Sanity: capture `tar tf` into a var first (a `tar tf | grep -q`
          # pipeline trips set -o pipefail via SIGPIPE — see test-llama-cpp.yml).
          contents="$(tar tf ./*.pkg.tar.zst)"
          echo "Packaged binaries:"
          echo "$contents" | grep '^usr/bin/llama-' || true
          if grep -q 'usr/bin/llama-server' <<< "$contents"; then
            echo "OK: usr/bin/llama-server present"
          else
            echo "::error::package is missing usr/bin/llama-server"
            exit 1
          fi
