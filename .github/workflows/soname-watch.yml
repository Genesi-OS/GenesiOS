name: Library check (soname watch)

# Every day: do the libraries our compiled packages link against still exist
# in the current Arch/CachyOS repositories? When Arch bumps a soname it
# rebuilds its own packages; ours keep asking for the old file and break on
# the next update (sndio 1.11, 2026-11-20: every Genesi Hyprland desktop came
# up blank). This catches it the day it happens and opens an issue naming the
# packages to rebuild. Logic: genesi-arch/ci/soname-watch.sh.
#
# Read-only towards the repository and the update pipeline: it downloads the
# published packages and inspects them, nothing else.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every NEEDED library of our compiled packages
        id: check
        shell: bash
        run: |
          set +e
          docker run --rm -v "$PWD:/w" -w /w -e REPORT=/w/soname-report.txt \
            cachyos/cachyos-v3:latest bash genesi-arch/ci/soname-watch.sh
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Open or update an issue
        if: steps.check.outputs.rc == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Library check: compiled packages need a rebuild"
          body="$(printf 'A library our packages link against is no longer in the Arch/CachyOS repositories, so those packages break on the next update.\n\n```\n%s\n```\n\nBump the pkgrel of each package listed so the publish rebuilds it against the current libraries.\n\nRun: %s/%s/actions/runs/%s' "$(cat soname-report.txt)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          existing="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Fail when something is missing
        if: steps.check.outputs.rc != '0'
        run: exit 1
