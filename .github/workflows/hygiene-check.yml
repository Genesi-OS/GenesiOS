name: Hygiene check

# Fast guard (no build) that fails if tooling/editor state ever leaks into a
# `skel-override/` directory. skel-override is copied into every new user's HOME
# on an installed system, so a stray `.omc/` (oh-my-claudecode), `.claude/`,
# `.vscode/`, etc. there would ship to users. This already happened once
# (.omc/ committed under genesi-settings' skel-override), hence the guard.
#
# It inspects TRACKED files across the repo AND submodules (git ls-files
# --recurse-submodules) — i.e. exactly what would be packaged — not the local
# working tree, so local tooling dirs don't trip it.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  skel-override-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if tooling/editor state is under any skel-override/
        shell: bash
        run: |
          set -euo pipefail
          # Tracked files (superproject + submodules) that sit under a
          # skel-override/ dir AND are a known tooling/editor state directory.
          junk="$(git ls-files --recurse-submodules \
            | grep -E '/skel-override/' \
            | grep -E '/\.(omc|claude|verdent|vscode|idea)(/|$)' || true)"
          if [ -n "$junk" ]; then
            echo "::error::Tooling/editor state leaked into skel-override (would land in every new user's HOME):"
            printf '  %s\n' $junk
            echo ""
            echo "Fix: remove it from the owning repo (git rm --cached), add the dir"
            echo "to that repo's .gitignore, and bump the submodule pointer here."
            exit 1
          fi
          echo "OK: no tooling/editor state under any skel-override/"

  keyring-wiring:
    # The signing key and the packages that reference it have to move together.
    # This is a text check with no build, so it runs on every push and PR and
    # catches the ordering mistake — a dependency on a package CI is still
    # skipping — before it can reach the ISO pipeline or a real install.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: genesi-keyring wiring is consistent
        shell: bash
        run: bash genesi-arch/ci/keyring-wiring-test.sh

  bootloader-and-boot-test:
    # Both are static/no-build, so they run on every push and PR. The bootloader
    # check catches a menu pointing at an entry that does not exist in a second;
    # the selftest keeps iso-boot-test.sh's polling logic honest, and that logic
    # decides whether an ISO gets published.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The Calamares netinstall groups are an install path, and
          # package-reachability-test.py cannot answer correctly without them:
          # every package reachable only through netinstall would look like an
          # orphan. It refuses to run rather than report that, so this is not
          # optional.
          submodules: true

      - name: Boot menus point at entries that exist
        shell: bash
        run: bash genesi-arch/ci/bootloader-config-test.sh

      - name: The ISO boot test's own logic
        shell: bash
        run: bash genesi-arch/ci/iso-boot-test-selftest.sh

      - name: genesi-report does not leak the reporter
        shell: bash
        run: bash genesi-arch/ci/report-redaction-test.sh

      - name: genesi-report looks where Genesi installs its config
        shell: bash
        run: python3 genesi-arch/ci/report-sees-our-config-test.py

      - name: Bar presets describe a bar that can exist
        shell: bash
        run: python3 genesi-arch/ci/bar-presets-test.py

      - name: The ISO's systemd enable symlinks are symlinks
        shell: bash
        run: bash genesi-arch/ci/systemd-enable-test.sh

      - name: The caelestia launcher actions have not drifted
        shell: bash
        # Without the upstream tarball it checks the half it can: that Genesi's
        # own actions are still there and that the launcher's Logout is still
        # the clean session exit rather than the black-screen command. The full
        # drift check runs in genesi-caelestia-shell's prepare(), where their
        # source is on disk.
        run: python genesi-arch/ci/caelestia-actions-test.py

      - name: Every package we build reaches a machine
        # Twice a package has been written, built, published and signed, and
        # then installed on nobody, because the one line that pulls it in was
        # never added: genesi-display (six launcher actions that did nothing
        # when clicked) and genesi-update-kcm (KDE had no update page at all
        # while Hyprland had one). Neither produced an error anywhere.
        #
        # Needs the submodules, which this job already checks out: the
        # Calamares netinstall groups are an install path.
        run: python genesi-arch/ci/package-reachability-test.py

      - name: Every section of the Hyprland migration applies
        shell: bash
        # /etc/skel only seeds NEW accounts, so anything added to hyprland.conf
        # reaches existing users through the .install migration or not at all.
        # It reached them not at all: a hand-maintained "already up to date"
        # gate returned before the new section, so the display keybinds were
        # written, shipped, installed and never applied to a single config.
        # Nothing errored. This reads the section markers out of the scriptlet
        # itself, so a new section is covered without anyone remembering.
        run: bash genesi-arch/ci/hypr-migration-test.sh

      - name: GTK widgets are not built before GTK exists
        # All four tray applets segfaulted at login with the same stack: the
        # menu is built in Tray.__init__ and Gtk.main() -- which used to be
        # what initialised GTK -- only runs afterwards. PyGObject stopped
        # initialising Gtk implicitly on import. The symptom is three tray
        # icons that simply are not there, with the reason only in a coredump.
        # This found a fifth tray with the same bug that nobody had reported.
        run: python genesi-arch/ci/gtk-init-order-test.py

      - name: Screen shaders are in the shape Hyprland accepts
        # Hyprland leaves the screen untouched when a shader fails to compile
        # and reports it nowhere the user looks, so a typo ships as a launcher
        # entry that appears to do nothing. This is the structural half --
        # right dialect, right uniforms; genesi-shaders' own check() runs the
        # real compiler at build time.
        run: python genesi-arch/ci/shader-sanity-test.py

      - name: systemd units point at units that exist
        # Genesi rebrands CachyOS material with a blanket
        # `sed s/cachyos/genesi/g` over the package. That is right for text and
        # wrong for identifiers: it rewrote a .path unit's trigger to a service
        # that does not exist while leaving the service file's NAME alone, and
        # the failure appeared on every boot in the journal and nowhere else.
        run: python genesi-arch/ci/systemd-unit-refs-test.py
