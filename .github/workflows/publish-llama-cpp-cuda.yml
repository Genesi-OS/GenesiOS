name: Build and Publish CUDA llama.cpp

# Dedicated, ISOLATED publisher for the prebuilt CUDA llama.cpp
# (genesi-llama-cpp-cuda, ~122 MB). It's over GitHub's 100 MB git-file limit, so
# it can't live in the git-hosted [genesi] repo; and it must NOT share the
# [genesi-apps] release with genesi-code (that pipeline rebuilds its db from
# scratch and would clobber this package). So this workflow owns its own
# release-hosted pacman repo: tag `cuda-repo`, db `genesi-cuda`. The client is
# preconfigured with the [genesi-cuda] repo (pacman.conf + genesi-ai-mode's
# .install), so AI Mode's "switch to CUDA" button installs it with a plain
# `pacman -S genesi-llama-cpp-cuda`.
#
# Manual + path-triggered only: the CUDA build is heavy (~50 min) and the package
# tracks upstream llama.cpp, not day-to-day OS changes, so it never runs on a
# normal push. Package assets are immutable (unique pkgrel per publish); the db
# is switched only after the upload is verified byte-for-byte.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'genesi-arch/packages/genesi-llama-cpp-cuda/**'
      - '.github/workflows/publish-llama-cpp-cuda.yml'

permissions:
  contents: write

concurrency:
  group: publish-llama-cpp-cuda
  cancel-in-progress: false

env:
  CUDA_TAG: cuda-repo
  DB_NAME: genesi-cuda
  PKG: genesi-llama-cpp-cuda

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: cachyos/cachyos-v3:latest
      options: --privileged

    steps:
      - name: Install git + gh in container
        run: pacman -Sy --needed --noconfirm git openssh github-cli

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build deps (incl. CUDA toolkit)
        run: |
          set -euxo pipefail
          pacman -Sy --noconfirm
          pacman -S --needed --noconfirm --overwrite='*' \
            base-devel git \
            systemd systemd-sysvcompat \
            cmake cuda

      - name: Headroom (overcommit + swap)
        shell: bash
        run: |
          set -x
          sysctl -w vm.overcommit_memory=1 || echo "::warning::could not set overcommit"
          set +e
          if [ ! -e /ci-swapfile ]; then
            avail_mb=$(df --output=avail -m / 2>/dev/null | tail -1 | tr -d ' '); avail_mb=${avail_mb:-0}
            want_mb=$(( avail_mb / 2 )); [ "$want_mb" -gt 16384 ] && want_mb=16384
            if [ "$want_mb" -ge 2048 ]; then
              fallocate -l "${want_mb}M" /ci-swapfile 2>/dev/null \
                || dd if=/dev/zero of=/ci-swapfile bs=1M count="$want_mb" status=none
              if [ -s /ci-swapfile ]; then
                chmod 600 /ci-swapfile
                mkswap /ci-swapfile >/dev/null 2>&1 && swapon /ci-swapfile \
                  || echo "::warning::swapon failed — relying on overcommit"
              fi
              swapon --show 2>/dev/null | grep -q /ci-swapfile || rm -f /ci-swapfile
            fi
          fi
          set -e
          swapon --show || true; free -h || true

      - name: Build + assemble the repo
        shell: bash
        run: |
          set -euo pipefail
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

          OUT="$GITHUB_WORKSPACE/genesi-arch/packages/cuda-repo"
          mkdir -p "$OUT"; chown builder:builder "$OUT"

          # Unique pkgrel per publish so package filenames are immutable (pacman
          # caches the compressed size; replacing a filename later trips curl's
          # "Maximum file size exceeded"). The committed pkgrel is just a floor.
          cd "$GITHUB_WORKSPACE/genesi-arch/packages/$PKG"
          PUBLISH_REL="${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          sed -i "s/^pkgrel=.*/pkgrel=${PUBLISH_REL}/" PKGBUILD

          start=$(date +%s)
          if timeout 7200 runuser -u builder -- env \
              PATH="/opt/cuda/bin:$PATH" PKGDEST="$OUT" \
              makepkg -f --noconfirm --noprogressbar; then
            rc=0
          else
            rc=$?
          fi
          echo "build took $(( $(date +%s) - start ))s, exit=$rc"
          [ "$rc" -eq 0 ] || { echo "::error::$PKG failed to build (exit $rc)"; exit "$rc"; }

          cd "$OUT"
          echo "Built:"; ls -lh ./*.pkg.tar.zst
          # Sanity: llama-server must be in the package (capture then match — a
          # `tar tf | grep -q` pipeline trips pipefail via SIGPIPE).
          contents="$(tar tf ./*.pkg.tar.zst)"
          grep -q 'usr/bin/llama-server' <<< "$contents" \
            || { echo "::error::package missing usr/bin/llama-server"; exit 1; }

          # Build the release-hosted pacman db.
          rm -f "${DB_NAME}".db* "${DB_NAME}".files*
          repo-add "${DB_NAME}.db.tar.gz" ./*.pkg.tar.zst
          # pacman fetches <repo>.db / <repo>.files (repo-add makes those symlinks;
          # Release assets must be flat files, so replace them with real copies).
          cp --remove-destination "${DB_NAME}.db.tar.gz"    "${DB_NAME}.db"
          cp --remove-destination "${DB_NAME}.files.tar.gz" "${DB_NAME}.files"

          # Verify repo-add recorded the exact filename + compressed size.
          PACKAGE_PATH=$(find . -maxdepth 1 -type f -name "${PKG}-*.pkg.tar.zst" -print -quit)
          test -n "$PACKAGE_PATH"
          PACKAGE_NAME=${PACKAGE_PATH#./}
          PACKAGE_SIZE=$(stat -c%s "$PACKAGE_PATH")
          DESC_ENTRY=$(bsdtar -tf "${DB_NAME}.db.tar.gz" | grep '/desc$' | head -1)
          DB_NAME_IN=$(bsdtar -xOf "${DB_NAME}.db.tar.gz" "$DESC_ENTRY" | awk '/^%FILENAME%$/{getline; print; exit}')
          DB_SIZE_IN=$(bsdtar -xOf "${DB_NAME}.db.tar.gz" "$DESC_ENTRY" | awk '/^%CSIZE%$/{getline; print; exit}')
          test "$DB_NAME_IN" = "$PACKAGE_NAME"
          test "$DB_SIZE_IN" = "$PACKAGE_SIZE"

          PACKAGE_SHA256=$(sha256sum "$PACKAGE_PATH" | awk '{print $1}')
          printf '%s  %s\n' "$PACKAGE_SHA256" "$PACKAGE_NAME" > "${PACKAGE_NAME}.sha256"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"

      - name: Publish immutable package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/genesi-arch/packages/cuda-repo"
          # --prerelease keeps this infrastructure release off the top of the
          # Releases page: `rolling` (the ISO download) must stay the only
          # non-prerelease. The TAG is baked into installed systems' pacman.conf
          # Server line, so it must never change — title/notes/flag are cosmetic.
          gh release create "$CUDA_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "[infra] Pacman repo — genesi-cuda (not a download)" \
            --prerelease \
            --notes "Release-hosted pacman repo for the prebuilt CUDA llama.cpp. Package assets are immutable; the stable db points to the current package. This is NOT the Genesi OS ISO download." \
            2>/dev/null || echo "Release $CUDA_TAG already exists — updating assets."
          if gh release view "$CUDA_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            -q '.assets[].name' | grep -Fxq "$PACKAGE_NAME"; then
            echo "::error::refusing to overwrite immutable package asset $PACKAGE_NAME"
            exit 1
          fi
          # Upload the unique package BEFORE switching the db (the old db keeps
          # referencing a package that still exists).
          gh release upload "$CUDA_TAG" --repo "$GITHUB_REPOSITORY" \
            "$PACKAGE_NAME" "${PACKAGE_NAME}.sha256"
          mkdir -p remote-package
          gh release download "$CUDA_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$PACKAGE_NAME" --dir remote-package
          cmp --silent "$PACKAGE_NAME" "remote-package/$PACKAGE_NAME"
          echo "$(cut -d' ' -f1 "${PACKAGE_NAME}.sha256")  remote-package/$PACKAGE_NAME" | sha256sum --check -

      - name: Publish repository db
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/genesi-arch/packages/cuda-repo"
          # Stable index names replaced only after the package upload was verified.
          gh release upload "$CUDA_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "${DB_NAME}.db.tar.gz" "${DB_NAME}.db" \
            "${DB_NAME}.files.tar.gz" "${DB_NAME}.files"
          echo "Published $PACKAGE_NAME to [genesi-cuda]."
