INCLUDE archiso_head.cfg

# `cos64`, not `arch64`. There has never been a LABEL named arch64 on the BIOS
# path -- the entries in archiso_sys-linux.cfg are cos64/cos64ram/cos64fb/
# cos64devcuda, and the arch64_* labels are PXE-only (archiso_pxe-linux.cfg),
# which this file does not include. DEFAULT therefore named nothing, and what
# actually booted on BIOS was vesamenu.c32's fallback to the first entry.
# It happened to be the right one, which is why nobody noticed; it was one
# reordering away from silently booting a different kernel.
DEFAULT cos64
TIMEOUT 150

INCLUDE archiso_sys-linux.cfg

INCLUDE archiso_tail.cfg
