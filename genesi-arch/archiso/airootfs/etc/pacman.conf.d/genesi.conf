# Genesi OS Repository
# Hosted on GitHub raw content

[genesi]
SigLevel = Optional TrustAll
Server = https://raw.githubusercontent.com/Genesi-OS/GenesiOS/main/genesi-arch/repo/$arch

# Large app packages (genesi-code, ...) — hosted on a GitHub Release because
# they exceed GitHub's 100 MB git file limit. Published by publish-apps.yml.
[genesi-apps]
SigLevel = Optional TrustAll
Server = https://github.com/Genesi-OS/GenesiOS/releases/download/apps-repo

# Prebuilt CUDA llama.cpp (genesi-llama-cpp-cuda, ~122 MB) — also >100 MB, so
# release-hosted. NVIDIA-only; installed on demand by AI Mode's "switch to CUDA"
# button/notification. Published by publish-llama-cpp-cuda.yml.
[genesi-cuda]
SigLevel = Optional TrustAll
Server = https://github.com/Genesi-OS/GenesiOS/releases/download/cuda-repo

# Genesi testing channel — packages built from the `develop` branch, on top of
# the stable ones above. DISABLED by default; toggle it with
# `genesi-channel set testing` or the experimental-updates switch in the Genesi
# Welcome app. These are pre-release packages and they can break your system.
#
# This block only has to be HERE for a fresh install: genesi-channel writes it
# itself when it is missing, which is what makes the switch work on machines
# installed before the channel existed.
#[genesi-testing]
#SigLevel = Optional TrustAll
#Server = https://raw.githubusercontent.com/Genesi-OS/GenesiOS/develop/genesi-arch/repo/$arch
