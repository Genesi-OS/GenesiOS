#
# /etc/pacman-target.conf - Genesi OS
# Pacman configuration for target system installation
#

[options]
HoldPkg     = pacman glibc
Architecture = auto

# Misc options
#UseSyslog
Color
#NoProgressBar
CheckSpace
VerbosePkgLists
ParallelDownloads = 5

SigLevel = Never
LocalFileSigLevel = Optional

# SigLevel note (see genesi-arch/docs/PACKAGE-SIGNING.md)
#
# `Optional TrustAll` is a MIGRATION state, not the end state. Optional = a
# signature is not required; TrustAll = if one is present, a key the machine
# does not know is accepted anyway. It has to stay this way until every
# installed machine has received genesi-keyring on a normal `pacman -Syu`:
# a machine set to `Required` without the key rejects every Genesi package,
# INCLUDING the keyring that would have fixed it, and the only way out is
# editing this file by hand.
#
# Raise this to `Required` only after ci/repo-signature-test.sh passes against
# the live repository. Do it in all the files that carry a [genesi*] block --
# the doc lists them.
[genesi]
SigLevel = Optional TrustAll
Server = https://raw.githubusercontent.com/Genesi-OS/GenesiOS/main/genesi-arch/repo/$arch

# Large app packages (genesi-code, ...) hosted on a GitHub Release, since they
# exceed GitHub's 100 MB git file limit. Published by publish-apps.yml.
[genesi-apps]
SigLevel = Optional TrustAll
Server = https://github.com/Genesi-OS/GenesiOS/releases/download/apps-repo

# Prebuilt CUDA llama.cpp (genesi-llama-cpp-cuda, ~122 MB), release-hosted.
# NVIDIA-only; pulled on demand by AI Mode. Published by publish-llama-cpp-cuda.yml.
[genesi-cuda]
SigLevel = Optional TrustAll
Server = https://github.com/Genesi-OS/GenesiOS/releases/download/cuda-repo

# Genesi testing channel — packages built from the `develop` branch, on top of
# the stable ones above. DISABLED by default; toggle it with
# `genesi-channel set testing` or the experimental-updates switch in the Genesi
# Welcome app. These are pre-release packages and they can break your system.
#
# This block only has to be HERE for a fresh install: genesi-channel writes it
# itself when it is missing, which is what makes the switch work on machines
# installed before the channel existed.
#[genesi-testing]
#SigLevel = Optional TrustAll
#Server = https://raw.githubusercontent.com/Genesi-OS/GenesiOS/develop/genesi-arch/repo/$arch

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# CachyOS repositories for kernels and optimized packages
[cachyos]
SigLevel = Optional TrustAll
Server = https://mirror.cachyos.org/repo/$arch/$repo
Server = https://cdn-77.cachyos.org/repo/$arch/$repo
Server = https://build.cachyos.org/repo/$arch/$repo
# Include = /etc/pacman.d/cachyos-mirrorlist
