# Genesi: do volume in software for USB audio outputs.
#
# ── The bug ──────────────────────────────────────────────────────────────────
#
# Reported: "below 54% the sound goes mute" on a USB headset. Measured on the
# machine, with music playing, by setting the volume and reading the device's
# own control back:
#
#   volume 0.70  ->  Playback 14 [44%] [7.00dB] [on]   audible
#   volume 0.40  ->  Playback  0 [0%]  [0.00dB] [on]   silent
#
# Never [off]. Nothing is muting anything. PipeWire is driving the device's
# volume control DOWN TO ITS LOWEST STEP, and that step is silence on this
# hardware, whatever dB it advertises there. The cliff is simply where the
# mapping reaches the floor; it lands between those two readings, and the
# reported 54% sits inside that window.
#
# The dB this device advertises is not to be believed, and the kernel says so
# at boot, in its own units of 1/256 dB:
#
#   usb 3-3.3: 8:0: sticky mixer values (0/4096/128 => 0), disabling
#                                        ^ 0dB ^+16dB ^0.5dB
#
# It wrote values, read back something else, and gave up on the control. A
# mixer the driver has given up on is not one to route volume through.
#
# api.alsa.soft-mixer takes it out of the path: PipeWire applies volume itself
# and leaves the device's own control alone.
#
# That is only half a fix, and shipping the half was worse than shipping
# nothing. soft-mixer does not centre the hardware mixer -- it stops driving
# it and leaves it wherever it already was, while PipeWire computes the whole
# volume in software as though the hardware were at unity. On the reporting
# machine it was at zero, so the setting worked exactly as asked and the audio
# went silent at every volume, maximum included:
#
#   volume 0.70  ->  Playback 0 [0%] [0.00dB] [on]   silent
#   volume 0.40  ->  Playback 0 [0%] [0.00dB] [on]   silent
#
# genesi-open-usb-mixer, in this package, makes the assumption true by opening
# that control. The two only work together, and the PKGBUILD's check() refuses
# to build one without the other.
#
# ── Why this file did nothing for three tries ────────────────────────────────
#
# api.alsa.soft-mixer was already set, and `wpctl inspect` on the sink showed
#
#   api.alsa.soft-mixer = "true"
#
# and it still had no effect. The readings above were taken WITH it set, and
# the hardware control tracked the volume regardless.
#
# The rule matched `node.name`, so the property landed on the NODE. The ALSA
# mixer belongs to the DEVICE, and is built when the device is created -- long
# before anything reads a property off that node. So the setting was visible
# everywhere a person would look and applied nowhere, which is worse than
# absent: every report confirmed the fix was in place.
#
# Matching the device is what makes it real. The node match stays too: it costs
# nothing and it is what keeps the setting visible in `wpctl inspect` and in
# genesi-report.
#
# ── The cost, stated plainly ─────────────────────────────────────────────────
#
# This applies to every USB audio OUTPUT, not only broken ones, and a USB DAC
# with an honest wide mixer is better off with hardware volume: it keeps
# hardware mixing, and on some devices a physical knob drives that control
# directly. "Only the ones the kernel flagged" is not expressible in a
# WirePlumber rule, so the choice is all USB outputs or none, and predictable
# everywhere wins over better on some.
#
# Inputs are NOT matched. A USB microphone's capture gain is real analogue gain
# that does useful work; the first version took it away only because the rule
# had been copied alongside the output one.
monitor.alsa.rules = [
  {
    matches = [
      # The device. This is the match that does the work -- a rule matching
      # only the node sets a property nothing ever reads.
      { device.name = "~alsa_card.usb-.*" }
      # The node, so the setting is visible in `wpctl inspect` and can be
      # confirmed from a user's report.
      { node.name = "~alsa_output.usb-.*" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
