# Genesi: do volume in software for USB audio devices.
#
# ── Why ──────────────────────────────────────────────────────────────────────
#
# Reported from a real desk: "below 54% the sound goes mute." Diagnosed from
# the machine rather than guessed:
#
#   default sink   fifine Headset, USB
#   mixer range    Limits: Playback 0 - 87   (88 steps for the whole scale)
#   at 64%         -23.25 dB
#   wireplumber    no configuration at all — the hardware mixer is in use
#
# and, from the kernel at boot:
#
#   usb 3-3.3: 8:0: sticky mixer values (0/4096/128 => 0), disabling
#
# That last line is the answer. The kernel wrote volume values to the device,
# read back something else, and disabled the control: the headset's mixer does
# not honour what it is told. PipeWire keeps driving volume through it anyway,
# because nothing here said otherwise, and below a point the device just
# applies zero.
#
# api.alsa.soft-mixer makes PipeWire apply volume itself and leave the device's
# mixer at unity, so the whole slider works and a broken mixer cannot mute
# anything.
#
# ── Why only USB ─────────────────────────────────────────────────────────────
#
# Built-in HDA codecs generally have honest, wide mixers, and taking hardware
# volume away from them would cost real things: a laptop's volume keys driving
# the codec directly, and hardware mixing. USB audio is where sticky and
# narrow-range mixers actually live. Matching the class rather than one
# device's name means the next headset with the same firmware bug is covered
# without another release.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.usb-.*" }
      { node.name = "~alsa_input.usb-.*" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
