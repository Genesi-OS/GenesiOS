# Genesi: do volume in software for USB audio outputs.
#
# ── What this does NOT fix ───────────────────────────────────────────────────
#
# This file was written to fix "below 54% the sound goes mute" on a USB
# headset. It does not, and the machine has now said why.
#
# The headset's ONE playback control, read back from it:
#
#   Simple mixer control 'Headphone',0
#     Limits: Playback 0 - 32
#     Playback 0  [0%]  [0.00dB]        <- one boot
#     Playback 10 [31%] [5.00dB]        <- another
#
# 0.5 dB a step from 0.00 dB, so the range is 0 dB to +16 dB. The kernel says
# the same thing independently, in its own units of 1/256 dB:
#
#   usb 3-3.3: 8:0: sticky mixer values (0/4096/128 => 0), disabling
#                                        ^ 0dB ^+16dB ^0.5dB
#
# That control is a GAIN. Its minimum is unity. It has no attenuation to give,
# so no setting of it can make anything quieter, and it cannot be what mutes
# the output. Three fixes were aimed at it, this one included, and the fourth
# would have been too. The measurement closes it: whatever silences that
# headset at low volume is not its ALSA mixer, and the search moves elsewhere.
#
# ── Why it is still here ─────────────────────────────────────────────────────
#
# On a narrower claim, which the same kernel line supports: "sticky mixer
# values ... disabling" means the driver wrote to the device, read back
# something else, and gave up on the control. Leaving PipeWire to steer a mixer
# that ignores what it is told produces volume that does not match the slider
# and cannot be reasoned about. api.alsa.soft-mixer takes that mixer out of the
# path -- PipeWire applies volume itself and leaves the device alone.
#
# ── The cost, stated plainly ─────────────────────────────────────────────────
#
# This applies to every USB audio OUTPUT, not only broken ones, and a USB DAC
# with an honest wide mixer is better off with hardware volume: it keeps
# hardware mixing, and on some devices a physical knob drives that control
# directly. There is no way to express "only when the kernel flagged this
# device" in a WirePlumber rule, so the choice is all USB outputs or none, and
# predictable-everywhere wins over better-on-some.
#
# Inputs are NOT matched any more. A USB microphone's capture gain is real
# analogue gain that does useful work, and the earlier version took it away for
# no reason at all -- it was only ever copied alongside the output rule.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.usb-.*" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
