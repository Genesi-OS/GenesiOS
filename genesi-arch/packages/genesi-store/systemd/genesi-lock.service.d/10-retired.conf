# Shipped by genesi-store to retire a unit that older versions of it wrote
# into ~/.config/systemd/user/genesi-lock.service.
#
# That unit ran hypridle so that `loginctl lock-session` would start hyprlock.
# caelestia already answers that signal itself -- its IdleMonitors wire a
# LogindManager straight to the session's Lock and Unlock -- so the unit
# started a SECOND locker on the Wayland ext-session-lock protocol, which only
# one client may hold, and the shell crashed when the session unlocked.
#
# Drop-ins are read from every directory in the unit search path, so this
# applies to the copy in the user's home as well. The condition names a path
# nothing creates, so the unit never starts again. The store also removes the
# unit itself the next time it runs; this is for the machine where it does not.

[Unit]
ConditionPathExists=/usr/share/genesi-store/lock-watcher-is-retired-and-this-never-exists
