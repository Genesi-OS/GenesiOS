[General]
# The picture behind the login screen. Empty means the theme draws its own
# background, which is the default: a greeter that depends on a file somebody
# may delete is a greeter that comes up black on the one boot it matters.
background=
# Genesi's own green. Changing these two is the supported way to retint the
# login screen without editing QML.
accent=#39d98a
surface=#070c09
# 24-hour clock unless somebody says otherwise.
twelveHour=false
