# Genesi AI Assist — passive, always-on AI helpers.
#
# These are the helpers that use the local model WITHOUT being asked: the two
# dim lines that appear under a command that just failed, and anything else
# built on the same gate later.
#
# The rule they all follow: a passive helper must be free. It never loads a
# model — it only uses one that is ALREADY warm on the Genesi Turbo daemon. If
# nothing is warm, nothing happens, silently. It also stands down while a real
# inference is running, while Studio Mode has the machine, and (by default) on
# battery.
#
# Read live; no restart needed. Per-user overrides go in
# ~/.config/genesi-ai-assist.conf and win over this file.

# Master switch for every passive helper.
enabled = on

# The shell hook that explains a command that just failed.
# It never re-runs your command — it only sees the command line and the exit
# code. For a failure where the actual output matters, pipe it instead:
#     some-command 2>&1 | genesi-explain
explain_errors = on

# Offer the fix as ghost text.
#
# When the explanation ends in a concrete command, that command is shown dim,
# ahead of the cursor, at the next prompt — press → (or Ctrl-F) to put it on the
# command line. It is NEVER executed for you: → types it, you press Enter.
#
# Fixes that delete or overwrite (rm, dd, mkfs, git reset --hard, curl | sh, …)
# are printed but never armed on a keypress. A command that can destroy your
# work should cost more than brushing an arrow key.
suggest_fix = on

# fish only: put the fix into fish's history so fish itself draws the ghost.
#
# fish has no API for setting an autosuggestion, and its only sources are
# completions and history — so this is what makes the dim inline suggestion
# appear in Genesi's default shell. The trade-off is one history entry for a
# command that was never run. Turn this off and → still works; you just do not
# see the suggestion as you type.
suggest_fix_history = on

# Plain-language file search (genesi-find, and "Search with AI here" in Dolphin).
#
# The model never touches your disk: it only turns "the contract PDF I saved
# last month" into a filter (extensions, words, a date range), which Genesi runs
# with fd/find locally. With no model warm it still searches — just with the
# built-in keyword parser instead.
smart_find = on

# Run passive helpers while on battery?
# Off by default: inference the user did not ask for is the rudest possible use
# of a laptop's remaining charge.
#
# This applies to helpers that fire on their OWN (the error explainer). Things
# you invoke by hand, like genesi-find, are not gated on it — you asked.
on_battery = off

# Per-call token budget. An explanation is two lines, not an essay; keeping
# this small is most of what keeps the helpers cheap.
max_tokens = 160

# Seconds to wait for the model.
#
# The shell hook runs the explainer BEFORE drawing the next prompt, so this is
# how long the terminal can pause after a command FAILS. It never delays a
# successful command, it is instant when no model is warm (the connection is
# refused immediately), and a cached answer costs nothing. Lower it if the
# pause bothers you; the feature simply gives up and stays silent.
timeout = 4

# How long an answer stays cached in ~/.cache/genesi-ai-assist.
# The same typo should never be paid for twice.
cache_days = 30
