# Genesi Mesh — node configuration.
#
# Edit and then `sudo systemctl reload genesi-meshd` (or use the `genesi-mesh`
# CLI, which writes here and reloads for you).

# Offer THIS machine's GPU to the mesh.
#
# OFF by default, deliberately. Turning it on starts llama.cpp's `rpc-server`,
# which performs NO authentication and NO validation of what it receives —
# upstream is explicit that it must never face an untrusted network. Enable it
# only on a network you control.
#   genesi-mesh worker on
worker = off

# Address rpc-server listens on when worker = on.
#
# 127.0.0.1 means "nobody but this machine", which makes worker mode useless for
# actual pooling but is the correct SAFE default; `genesi-mesh worker on` moves
# it to 0.0.0.0 for you and warns while doing it. Set it to a specific interface
# address (e.g. 192.168.1.20) to expose the GPU on exactly one network.
rpc_bind = 127.0.0.1

# TCP port for rpc-server (llama.cpp's own default is 50052).
rpc_port = 50052

# Megabytes of VRAM to advertise to clients. 0 = let rpc-server report what the
# device actually has. Set a lower number to reserve headroom for whatever else
# uses this GPU (a desktop session, a game, another model).
rpc_mem_mb = 0

# Announce this node on the LAN and collect peers. Turning this off makes the
# node invisible and blind, but leaves worker mode working for peers that were
# told about it by other means.
discovery = on

# Display name in `genesi-mesh peers`. Empty = the system hostname.
name =
