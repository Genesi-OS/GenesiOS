# Genesi OS — Package Installer catalog
# Schema (same as upstream cachyos packageinstaller): a flat list of categories,
# each with a name and a list of package names. A package entry can bundle a few
# packages on one line separated by spaces (installed together).
#
# Keep names to packages available in the Arch/CachyOS repos. This catalog is
# overlaid onto the genesi-packageinstaller fork at build time, so editing it
# here (genesi-arch/packages/**) rebuilds + ships via the update pipeline.

- name: "Browsers"
  packages:
    - firefox
    - chromium
    - librewolf-bin
    - brave-bin
    - vivaldi

- name: "Communication"
  packages:
    - discord
    - telegram-desktop
    - signal-desktop
    - thunderbird
    - element-desktop

- name: "Development"
  packages:
    - genesi-code
    - git
    - visual-studio-code-bin
    - neovim
    - "docker docker-compose docker-buildx"
    - github-cli
    - meld
    - dbeaver

- name: "AI / Local Models"
  packages:
    # Genesi's differentiator — local AI. AI Mode (genesi-aid) optimizes the
    # system automatically once any of these is running.
    - ollama
    # Arch's plain `ollama` runs on the CPU only. On an NVIDIA GPU this is the
    # build that uses it (it replaces ollama, a normal pacman conflict), and
    # `cuda` is the toolkit for building CUDA software yourself.
    - ollama-cuda
    - cuda
    - alpaca   # GTK Ollama front-end
    - gpt4all-chat

- name: "Gaming"
  packages:
    # One-click branded ecosystem. genesi-gaming pulls the CachyOS optimized
    # metas (Steam, Lutris, Heroic, Gamescope, Proton-CachyOS, Wine, MangoHud,
    # GOverlay) and adds Genesi's performance wrapper + overlay/cache defaults.
    - genesi-gaming
    # Individual picks, for users who want to cherry-pick instead of the bundle.
    - steam
    - lutris
    - heroic-games-launcher-bin
    - mangohud
    - gamemode
    - goverlay
    - "wine winetricks"
    - protontricks
    - vkbasalt

- name: "Multimedia"
  packages:
    - vlc
    - mpv
    - obs-studio
    - audacity
    - "kdenlive"
    - strawberry

- name: "Graphics"
  packages:
    - gimp
    - inkscape
    - krita
    - blender

- name: "Office"
  packages:
    - libreoffice-fresh
    - onlyoffice-bin
    - okular
    - obsidian

- name: "System & Utilities"
  packages:
    - htop
    - btop
    - fastfetch
    - timeshift
    - gnome-disk-utility
    - "p7zip unrar unzip"
    - flatpak

- name: "Kernel"
  packages:
    # CachyOS Kernel Manager — GUI to build/install/switch CachyOS kernels and
    # tune build options. Binary: cachyos-kernel-manager.
    - cachyos-kernel-manager

# There was a "DEV / TESTE (NVIDIA + CUDA)" category here: a leftover from
# validating Turbo's CUDA backend on the live session, in Portuguese, shown to
# every user. Its useful part (ollama-cuda, cuda) is under AI / Local Models.
# The rest is not for a menu: the NVIDIA driver is installed by chwd at
# install time with its KMS config, and nvidia-open-dkms from here skipped that.
